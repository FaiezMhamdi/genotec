<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>404 — Page Not Found | Mectrion </title>
  <meta name="description" content="The page you're looking for doesn't exist." />
  <link rel="icon" href="mectronicon.png" type="image/png" />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Inter:wght@400;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <link rel="stylesheet" href="style.css" />
  <style>
    .error-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }
    .error-content {
      max-width: 600px;
    }
    .error-code {
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(6rem, 15vw, 12rem);
      font-weight: 800;
      background: linear-gradient(135deg, var(--accent1, #00c9a7), #35e8ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1;
      margin-bottom: 1rem;
    }
    .error-title {
      font-size: 1.5rem;
      margin-bottom: 1rem;
      color: var(--text, #fff);
    }
    .error-description {
      color: var(--muted, #a0a0b0);
      margin-bottom: 2rem;
      line-height: 1.6;
    }
    .error-actions {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
    }
    .error-actions .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.8rem 1.5rem;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .error-actions .btn:hover {
      transform: translateY(-2px);
    }
    .btn-home {
      background: linear-gradient(135deg, #00c9a7, #35e8ff);
      color: #fff;
    }
    .btn-contact {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      color: #fff;
    }
  </style>
</head>
<body>
  <div class="floating-elements">
    <div class="floating-element el-1"></div>
    <div class="floating-element el-2"></div>
    <div class="floating-element el-3"></div>
  </div>

  <section class="error-page">
    <div class="error-content">
      <div class="error-code">404</div>
      <h1 class="error-title">Page Not Found</h1>
      <p class="error-description">
        The page you're looking for doesn't exist or has been moved.
        Let's get you back on track.
      </p>
      <div class="error-actions">
        <a href="index.html" class="btn btn-home">
          <i class="fas fa-home"></i>
          <span>Go Home</span>
        </a>
        <a href="contact.html" class="btn btn-contact">
          <i class="fas fa-envelope"></i>
          <span>Contact Us</span>
        </a>
      </div>
    </div>
  </section>
</body>
</html>
